<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Wikidata Cars{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand">🚗 Wikidata Cars</a>
        <nav>
            <a href="/">Поиск</a>
            <a href="/compare">Сравнение</a>
            <a href="/export.csv">CSV</a>
            <a href="https://github.com/Mirzoevmurad/wikidata-cars" target="_blank" rel="noopener">GitHub</a>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer>
        <span>Источник: <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a></span>
        {% if meta and meta.last_updated_utc %}
        <span>· обновлено: {{ meta.last_updated_utc }} UTC</span>
        {% endif %}
        {% if meta and meta.total_models %}
        <span>· моделей: {{ meta.total_models }}</span>
        {% endif %}
    </footer>
</body>
</html>
